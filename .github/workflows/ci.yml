name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tnl
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tnl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tnl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:web
        env:
          TNL_TEST_DATABASE_URL: postgresql://tnl:test@127.0.0.1:5432/tnl
